[project]
name = "local-inference-bench"
version = "0.1.0"
description = "Local LLM serving benchmark: Ollama vs llama.cpp vs MLX, two quantizations, quality-gated"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mlx-lm>=0.32.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
bench = "local_inference_bench.bench:main"
